version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Qdrant Vector Database for RAG Knowledge Embeddings
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: neurocare-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - neurocare-network

  # ----------------------------------------------------------------------------
  # MLflow Tracking Server for PyTorch Experiments & Metrics
  # ----------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: neurocare-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    networks:
      - neurocare-network

  # ----------------------------------------------------------------------------
  # NeuroCare-AI Dual Application (FastAPI :8000 + Streamlit :8501)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurocare-app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_URL=http://localhost:8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./logs:/workspace/logs
      - ./models:/workspace/models
      - ./rag_index:/workspace/rag_index
    depends_on:
      - qdrant
      - mlflow
    networks:
      - neurocare-network

networks:
  neurocare-network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
  mlflow_data:
    driver: local
