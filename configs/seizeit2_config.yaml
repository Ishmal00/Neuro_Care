dataset:
  name: SeizeIT2
  bids_id: ds005873
  subjects:
  - sub-001
  - sub-002
  - sub-003
  session: ses-01
  signals:
    eeg:
      sub_001_channels:
      - BTEleft SD
      - CROSStop SD
      sub_002_channels:
      - BTEleft SD
      - CROSStop SD
      sub_003_channels:
      - BTEright SD
      - CROSStop SD
      original_sampling_rate_hz: 256
      resampled_rate_hz: 100
      bands:
        delta_hz:
        - 1.0
        - 4.0
        theta_hz:
        - 4.0
        - 8.0
        alpha_hz:
        - 8.0
        - 13.0
        beta_hz:
        - 13.0
        - 30.0
    ecg:
      channel: ECG SD
      original_sampling_rate_hz: 256
      r_peak_detection_method: pantompkins1985
      features:
      - HR_mean
      - RMSSD
      - SDNN
    emg:
      channel: EMG SD
      original_sampling_rate_hz: 256
      resampled_rate_hz: 100
      features:
      - EMG_mean
      - EMG_std
    mov:
      channels:
      - EEG SD ACC X
      - EEG SD ACC Y
      - EEG SD ACC Z
      original_sampling_rate_hz: 25
      resampled_rate_hz: 100
      magnitude_formula: sqrt(X^2 + Y^2 + Z^2)
      features:
      - ACC_mean
      - ACC_std
      - ACC_energy
windowing:
  window_length_sec: 60.0
  overlap_ratio: 0.5
  window_step_sec: 30.0
  synchronization_method: absolute_recording_timestamps
labeling:
  rule: window_start < seizure_end AND window_end > seizure_start
  positive_label: 1
  negative_label: 0
outputs:
  features_csv: data/seizeit2_features.csv
  labels_csv: data/seizeit2_labels.csv
  log_file: data/seizeit2_processing_log.txt
